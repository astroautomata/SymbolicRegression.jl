id: "pbar-narrow-multiline"
title: "A narrow progress display throws on a multiline postfix"
priority: "P2"
kind: "wrong-exception"
area: "Infrastructure"
files: ["src/ProgressBars.jl"]
functions: ["format_for_meter", "newlines_to_spaces"]
summary: |-
  A positive width smaller than the label margin becomes a negative chunk width.
likelihood: |-
  PySR default-path likelihood: conditional, very narrow display and multiline postfix |.
maybe_intended: ""
reproducer: |
  using SymbolicRegression
  using SymbolicRegression.ProgressBarsModule: format_for_meter

  caught = try
      format_for_meter(("label", "a\nb"), 3)
      nothing
  catch e
      e
  end
  @assert caught isa ArgumentError
  @assert caught.msg == "can't repeat a character -7 times"
  println("format_for_meter((\"label\", \"a\\nb\"), 3) threw ", repr(caught), "; expected a formatted value at positive width")
  println("REPRODUCED pbar-narrow-multiline")
runtime:
  julia_version: "1.12.6"
  sr_commit: "103f5d4299222fa4af70110f4886ced4f3fdac1b"
  de_version: "2.13.0"
  output: |
    RUNTIME julia=1.12.6 de=2.13.0
    format_for_meter(("label", "a\nb"), 3) threw ArgumentError("can't repeat a character -7 times"); expected a formatted value at positive width
    REPRODUCED pbar-narrow-multiline
expected: |-
  Render a postfix at every positive width or omit its label when necessary.
promised_by: |-
  A positive width should not become an invalid chunk size.
cause: |-
  src/ProgressBars.jl:1-70: A positive width smaller than the label margin becomes a negative chunk width.
possible_fix: "Clamp the content width or move the label to its own line."
duplicates:
  issues: []
  queries:
    [
      "gh issue list --state all on astroautomata/SymbolicRegression.jl and astroautomata/PySR",
      "gh search issues --repo astroautomata/SymbolicRegression.jl 'batching'",
      "gh search issues --repo astroautomata/PySR 'batching'",
    ]
lean:
  property: "SymReg.Infra.progressNarrowMultiline"
  theorem: "SymReg.Infra.progressNarrowMultiline_refuted"
covers: []
