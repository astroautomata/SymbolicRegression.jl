id: "hof-nan-recovery"
title: "NaN cost locks a hall-of-fame slot"
priority: "P1"
kind: "wrong-result"
area: "Hall of fame"
files: ["src/HallOfFame.jl"]
functions: ["update_hall_of_fame!", "_update_hall_of_fame_unchecked!"]
summary: |-
  A NaN cost admitted to an empty slot cannot be displaced by a finite cost.
likelihood: |-
  PySR default-path likelihood: conditional, nonfinite scoring.
maybe_intended: ""
reproducer: |
  using SymbolicRegression
  options = Options(; binary_operators=[+], maxsize=5, deterministic=true)
  dataset = Dataset(zeros(1, 2), zeros(2))
  hof = HallOfFame(options, dataset)
  bad = copy(hof.members[1])
  bad.cost = NaN
  bad.loss = 1.0
  good = copy(hof.members[1])
  good.cost = 1.0
  good.loss = 1.0
  SymbolicRegression.update_hall_of_fame!(hof, bad, options)
  SymbolicRegression.update_hall_of_fame!(hof, good, options)
  println("NaN incumbent followed by finite challenger: cost=", hof.members[1].cost)
  if hof.exists[1] && isnan(hof.members[1].cost) && hof.members[1] !== bad
      println("REPRODUCED hof-nan-recovery")
  end
runtime:
  julia_version: "1.12.6"
  sr_commit: "103f5d4299222fa4af70110f4886ced4f3fdac1b"
  de_version: "2.13.0"
  output: |
    NaN incumbent followed by finite challenger: cost=NaN
    REPRODUCED hof-nan-recovery
expected: |-
  A finite-cost member replaces the NaN incumbent at the same complexity.
promised_by: |-
  The hall keeps the best member at each complexity.
cause: |-
  src/HallOfFame.jl:130: A NaN cost admitted to an empty slot cannot be displaced by a finite cost.
possible_fix: "Reject NaN costs or let finite challengers replace them."
