    avg_y=nothing target_average=100.0 baseline_loss=10001.0 loss_at_average=1.0 use_baseline=true
    mean predictor: raw loss=1.0, actual cost=9.999e-5, cost with mean baseline=1.0
    At T=1, alpha=3.17, raw loss increase=1: acceptance probability (offset vs centered) 0.9999684579106142 vs 0.7294551355029247; accepted out of 10000 identical seeded draws: 10000 vs 7209
    REPRODUCED loss-baseline-average
expected: |-
  For targets 99 and 101, the mean predictor has loss 1, so a candidate with raw loss 1 should contribute 1 to cost before the parsimony term.
promised_by: |-
  Dataset.jl:36-38 documents the loss of predicting the average target. With default alpha 3.17 and T=1, annealing accepts a raw loss increase of 1 with probability 0.999968 on the offset data instead of 0.729455 on the equivalent centered data. For 10,000 identical fixed-seed draws, every worse proposal is accepted on the offset data, compared with 7,209 on the centered data.
cause: |-
  src/LossFunctions.jl:260-263: Squared loss on ordinary noncentered numeric targets is normalized against zero rather than the documented mean predictor.
possible_fix: "Construct the baseline using the numeric target mean when the expression type supports it."
