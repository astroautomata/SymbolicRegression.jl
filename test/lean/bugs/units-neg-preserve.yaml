id: "units-neg-preserve"
title: "Unit checks reject negation and ReLU of dimensioned values"
priority: "P1"
kind: "wrong-result"
area: "Units"
files: ["src/DimensionalAnalysis.jl","src/Operators.jl"]
functions: ["degn_eval","@maybe_return_call"]
summary: |-
  The quantity wrapper lacks unary minus and zero, so valid negation and rectification receive a penalty.
likelihood: |-
  PySR default-path likelihood: conditional, units and neg/relu |.
maybe_intended: ""
reproducer: |
  using SymbolicRegression
  using SymbolicRegression: Dataset
  using SymbolicRegression.CoreModule.OperatorsModule: neg, relu
  using SymbolicRegression.DimensionalAnalysisModule: violates_dimensional_constraints

  # x1 is in metres and so is the target: neg(x1) and relu(x1) are consistent.
  options = Options(; binary_operators=[+, *], unary_operators=[neg, relu])
  ops = options.operators
  un(f) = findfirst(==(f), ops.unaops)
  bi(f) = findfirst(==(f), ops.binops)
  dataset = Dataset([1.0 2.0; 3.0 4.0], [1.0, 2.0]; X_units=["m", "1"], y_units="m")
  x1 = Node(Float64; feature=1)
  c = Node(Float64; val=2.0)
  trees = (
      neg=Node(; op=un(neg), children=(x1,)),
      relu=Node(; op=un(relu), children=(x1,)),
      neg_cx1=Node(; op=un(neg), children=(Node(; op=bi(*), children=(c, x1)),)),
  )
  results = map(t -> violates_dimensional_constraints(t, dataset, options), trees)
  println("violates(x1) = ", violates_dimensional_constraints(x1, dataset, options))
  println("violates = ", results)
  if all(values(results)) && !violates_dimensional_constraints(x1, dataset, options)
      println("REPRODUCED units-neg-preserve")
  end
runtime:
  julia_version: "1.12.6"
  sr_commit: "103f5d4299222fa4af70110f4886ced4f3fdac1b"
  de_version: "2.13.0"
  output: |
    RUNTIME julia=1.12.6 de=2.13.0
    violates(x1) = false
    violates = (neg = true, relu = true, neg_cx1 = true)
    REPRODUCED units-neg-preserve
expected: |-
  Preserve the input dimension on negation and ReLU.
promised_by: |-
  Both operations preserve the physical unit of their argument.
cause: |-
  src/DimensionalAnalysis.jl:20-32,142-171; src/Operators.jl:41-49: The quantity wrapper lacks unary minus and zero, so valid negation and rectification receive a penalty.
possible_fix: "Implement unary minus and a dimension-preserving zero for WildcardQuantity."
