id: "units-dimensionless-fn"
title: "Log, exp and cos reject explicitly dimensionless inputs during unit checks"
priority: "P1"
kind: "wrong-result"
area: "Units"
files: ["src/DimensionalAnalysis.jl"]
functions: ["degn_eval", "@maybe_return_call"]
summary: |-
  Trig, exp and log on explicitly dimensionless columns can be marked dimensionally invalid.
likelihood: |-
  PySR default-path likelihood: conditional, units enabled, ordinary operators |.
maybe_intended: ""
reproducer: |
  using SymbolicRegression
  using SymbolicRegression: Dataset
  using SymbolicRegression.CoreModule.OperatorsModule: safe_log
  using SymbolicRegression.DimensionalAnalysisModule: violates_dimensional_constraints

  # x2 is dimensionless ("1") and so is the target: cos(x2), exp(x2), log(x2) are consistent.
  options = Options(; binary_operators=[+, *], unary_operators=[cos, exp, log])
  ops = options.operators
  un(f) = findfirst(==(f), ops.unaops)
  dataset = Dataset([1.0 2.0; 3.0 4.0], [1.0, 2.0]; X_units=["m", "1"], y_units="1")
  x2 = Node(Float64; feature=2)
  results = Dict(
      f => violates_dimensional_constraints(Node(; op=un(f), children=(x2,)), dataset, options)
      for f in (cos, exp, safe_log)
  )
  println("violates(x2) = ", violates_dimensional_constraints(x2, dataset, options))
  println("violates(f(x2)) = ", results)
  if all(values(results)) && !violates_dimensional_constraints(x2, dataset, options)
      println("REPRODUCED units-dimensionless-fn")
  end
runtime:
  julia_version: "1.12.6"
  sr_commit: "103f5d4299222fa4af70110f4886ced4f3fdac1b"
  de_version: "2.13.0"
  output: |
    RUNTIME julia=1.12.6 de=2.13.0
    violates(x2) = false
    violates(f(x2)) = Dict{Function, Bool}(cos => 1, SymbolicRegression.CoreModule.OperatorsModule.safe_log => 1, exp => 1)
    REPRODUCED units-dimensionless-fn
expected: |-
  Accept scalar transcendental functions on known dimensionless quantities and return dimensionless results.
promised_by: |-
