id: "hof-score-zero-ratio"
title: "Equal zero losses get a positive logarithmic improvement score"
priority: "P2"
kind: "wrong-result"
area: "HofMig"
files: ["src/HallOfFame.jl"]
functions: ["compute_zero_centered_score"]
summary: |-
  At equal zeros the ratio is undefined and epsilon takes over. The strict Pareto display never passes such a pair.
likelihood: |-
  Outside ordinary PySR defaults; depends on a direct helper call, optional templates, or an exceptionally rare zero draw.
maybe_intended: ""
reproducer: |
  using SymbolicRegression
  hall = SymbolicRegression.HallOfFameModule
  score = hall.compute_zero_centered_score(0.0, 0.0, 1)
  println("compute_zero_centered_score(0.0, 0.0, 1)=", score)
  println("log(eps(0.0)) exact Float64 rational=", rationalize(BigInt, log(eps(0.0)); tol=0))
  println("relu(NaN)=", SymbolicRegression.relu(NaN), ", relu(-Inf)=", SymbolicRegression.relu(-Inf))
  if isfinite(score) && score > 0.0
      println("REPRODUCED hof-score-zero-ratio")
  end
