id: "cons-custom-size"
title: "Uncached constraint check ignores custom complexity"
priority: "P1"
kind: "wrong-result"
area: "Constraints and simplification"
files: ["src/CheckConstraints.jl"]
functions: ["check_constraints","compute_complexity"]
summary: |-
  Uncached checks unwrap the expression before calling complexity, so the documented custom size can be ignored.
likelihood: |-
  PySR default-path likelihood: conditional, function-valued mapping |.
maybe_intended: ""
reproducer: |
  using SymbolicRegression
  using DynamicExpressions: Node, Expression

  options = SymbolicRegression.Options(; binary_operators=[+], complexity_mapping=(_ -> 10))
  ex = Expression(Node(Float64; feature=1); operators=options.operators)
  complexity = SymbolicRegression.compute_complexity(ex, options)
  accepted = SymbolicRegression.CheckConstraintsModule.check_constraints(ex, options, 3)
  println("custom complexity=", complexity, "; maxsize=3, accepted=", accepted)
  if complexity == 10 && accepted
      println("REPRODUCED cons-custom-size")
  end
runtime:
  julia_version: "1.12.6"
  sr_commit: "103f5d4299222fa4af70110f4886ced4f3fdac1b"
  de_version: "2.13.0"
  output: |
    custom complexity=10; maxsize=3, accepted=true
    REPRODUCED cons-custom-size
expected: |-
  An expression with callback complexity 10 is rejected at maxsize 3.
promised_by: |-
  Options.jl documents maxsize and function-valued complexity mapping.
cause: |-
  src/CheckConstraints.jl:66-81: Uncached checks unwrap the expression before calling complexity, so the documented custom size can be ignored.
possible_fix: "Compute top-level size before unwrapping the expression."
duplicates:
