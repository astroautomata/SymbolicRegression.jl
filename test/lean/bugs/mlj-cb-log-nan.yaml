id: "mlj-cb-log-nan"
title: "One NaN loss can hide the best logarithmic score"
priority: "P2"
kind: "wrong-result"
area: "MLJ"
files: ["src/MLJInterface.jl"]
functions: ["choose_best"]
summary: |-
  Direct callers can pass NaN; normal reports filter it before selection with PR #790.
likelihood: |-
  Outside ordinary PySR defaults; depends on a direct helper call, optional templates, or an exceptionally rare zero draw.
maybe_intended: ""
reproducer: |
  # Reproducer for registry entry `mlj-cb-log-nan` (SymReg/MLJ/SelectProps.lean).
  # choose_best (src/MLJInterface.jl:715-730) computes `1.5 * minimum(losses)`; one NaN loss
  # makes the threshold NaN, so every row is masked to -Inf and argmax returns 1.
  using SymbolicRegression
  using SymbolicRegression.MLJInterfaceModule: choose_best

  losses = [2.0, 1.0, NaN]
  scores = [0.0, 1.0, 0.0]
  idx = choose_best(; trees=nothing, losses, scores, complexities=[1, 2, 3], options=Options())
  println("losses = $losses, scores = $scores: choose_best = $idx (expected 2)")
  if idx == 1
      println("REPRODUCED mlj-cb-log-nan")
  end
runtime:
  julia_version: "1.12.6"
  sr_commit: "103f5d4299222fa4af70110f4886ced4f3fdac1b"
  de_version: "2.13.0"
  output: |
    RUNTIME julia=1.12.6 de=2.13.0
