    REPRODUCED mut-pick-degree-has-operator
expected: |-
  For unary-only options, append, insert and prepend always choose a unary operator.
promised_by: |-
  A valid RNG draw must select an available operator whenever one exists.
cause: |-
  src/MutationFunctions.jl:237,278,325: At zero the draw misses every interval and can fall into an empty last arity.
possible_fix: "Use half-open cumulative intervals and skip degrees with zero operators."
