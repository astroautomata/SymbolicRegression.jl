id: "mutgen-cond-rotate-root"
title: "RotateTreeMutation remains selectable without a valid pivot"
priority: "P2"
kind: "wrong-result"
area: "Mutation sampling"
files: ["src/Mutate.jl", "src/MutationFunctions.jl"]
functions: ["condition_mutation_weights!"]
summary: |-
  A heavily weighted rotation is selectable even on a leaf, where it consumes an evaluation without changing the tree.
likelihood: |-
  PySR default-path likelihood: default, shallow trees |.
maybe_intended: ""
reproducer: |
  # Reproducer for registry entry `mutgen-cond-rotate-root` (SymReg/MutateGen/ConditionProps.lean).
  # condition_mutation_weights! never zeroes RotateTreeMutation, but randomly_rotate_tree!
  # returns the tree unchanged when no node is a valid rotation root
  # (src/MutationFunctions.jl:617-630), e.g. on every leaf.
  using SymbolicRegression
  using SymbolicRegression: Dataset, PopMember
  using SymbolicRegression.MutateModule: condition_mutation_weights!
  using SymbolicRegression.MutationFunctionsModule: randomly_rotate_tree!
  using DynamicExpressions: Node

  X = randn(2, 20)
  dataset = Dataset(X, X[1, :] .+ 1)
  options = Options(; binary_operators=[+, *])
  member = PopMember(dataset, Node(Float64; feature=1), options; deterministic=false)

  weights = copy(options.mutations)
  condition_mutation_weights!(weights, member, options, 10, 2)
  w = only(p.second for p in weights if p.first isa RotateTreeMutation)
  rotated = randomly_rotate_tree!(copy(member.tree))
  println("leaf ", member.tree, ": conditioned RotateTreeMutation weight = ", w,
      "; randomly_rotate_tree! gives ", rotated)
  if w > 0 && string(rotated) == string(member.tree)
      println("REPRODUCED mutgen-cond-rotate-root")
  end
runtime:
  julia_version: "1.12.6"
  sr_commit: "103f5d4299222fa4af70110f4886ced4f3fdac1b"
  de_version: "2.13.0"
  output: |
    RUNTIME julia=1.12.6 de=2.13.0
    leaf x1: conditioned RotateTreeMutation weight = 4.26; randomly_rotate_tree! gives x1
    REPRODUCED mutgen-cond-rotate-root
expected: |-
  Do not draw a rotation when no node has an operator child.
promised_by: |-
  Rotation cannot change such a tree, yet selection can charge a loss evaluation.
cause: |-
  src/Mutate.jl:175-215; src/MutationFunctions.jl:617-630: A heavily weighted rotation is selectable even on a leaf, where it consumes an evaluation without changing the tree.
possible_fix: "Apply the existing rotation-root eligibility test during conditioning."
