    violates = (greater_x1 = true, less_x1 = true, greater_x2 = true)
    REPRODUCED units-compare
expected: |-
  Allow equal-unit comparisons and produce a dimensionless result.
promised_by: |-
  Comparing two quantities expressed in the same unit is dimensionally valid.
cause: |-
