id: "ops-atanh-comment"
title: "atanh_clip comment describes remainder instead of modulo"
priority: "P3"
kind: "documentation"
area: "Operators"
files: ["src/Operators.jl"]
functions: ["atanh_clip"]
summary: |-
  The comment's `rem` formula disagrees with periodic `mod` wrapping on negative values.
likelihood: |-
  PySR default-path likelihood: conditional, code comment only |.
maybe_intended: ""
reproducer: |
  using SymbolicRegression
  const O = SymbolicRegression.CoreModule.OperatorsModule

  function reproduces()
      x = -2.0
      actual = O.atanh_clip(x)
      @assert mod(x + 1, 2) == 1.0
      @assert (x + 1) % 2 == -1.0
      comment_throws = try
          atanh((x + 1) % 2 - 1)
          false
      catch error
          error isa DomainError
      end
      @assert actual == 0.0
      @assert comment_throws
      println("atanh_clip(-2.0) = ", actual, "; comment's percent/rem formula throws DomainError")
      return true
  end

  reproduces() && println("REPRODUCED ops-atanh-comment")
