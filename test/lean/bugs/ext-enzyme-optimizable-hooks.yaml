    non-extension loss = 400.0; Enzyme result = MethodError(iterate, (SymbolicRegression.TemplateExpressionModule.TemplateOptimizableRefs{Tuple{@NamedTuple{n::Int64, ref::Vector{Base.RefValue{Node{Float64, 2}}}}}}(((n = 1, ref = Base.RefValue{Node{Float64, 2}}[Base.RefValue{Node{Float64, 2}}(3.0)]),), 2),), 0x00000000000097b7)
    REPRODUCED ext-enzyme-optimizable-hooks
expected: |-
  The Enzyme wrapper accepts the same template optimizer parameter vector and references as the normal evaluator.
promised_by: |-
  Optimizer extension hooks should use the expression’s matching getter and setter.
cause: |-
