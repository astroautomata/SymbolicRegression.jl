id: "tmpl-parse-accepts"
title: "Template guesses fail when only one component has a float literal"
priority: "P1"
kind: "wrong-exception"
area: "Templates"
files: ["src/TemplateExpression.jl"]
functions: ["parse_expression"]
summary: |-
  Ordinary guesses with a float literal in one component and none in another can produce incompatible node types.
likelihood: |-
  PySR default-path likelihood: conditional, template guesses.
maybe_intended: ""
reproducer: |
  # Reproducer for registry entry `tmpl-parse-accepts` (SymReg/Templates/Macro.lean).
  # parse_expression(::NamedTuple) parses each inner string on its own
  # (src/TemplateExpression.jl:1406-1424); a string with a Float64 literal gives Node{Float64}
  # and one without literals Node{Float32}, so the template constructor has no method.
  using SymbolicRegression
  using DynamicExpressions: DynamicExpressions as DE, OperatorEnum

  operators = OperatorEnum(1 => (sin,), 2 => (+, *))
  spec = @template_spec(expressions = (f, g)) do x, y
      f(x) + g(y)
  end
  outcome(guess) =
      try
          DE.parse_expression(guess; expression_spec=spec, operators)
      catch e
          e
      end
  both = outcome((; f="#1 + 1.0", g="sin(#1) * 2.0"))
  mixed = outcome((; f="#1 + 1.0", g="sin(#1)"))
  println("guess (f=\"#1 + 1.0\", g=\"sin(#1) * 2.0\") -> ", both isa Exception ? typeof(both) : typeof(both).name.name)
  println("guess (f=\"#1 + 1.0\", g=\"sin(#1)\")       -> ", mixed isa Exception ? typeof(mixed) : typeof(mixed).name.name,
      "  (expected a TemplateExpression)")
  if !(both isa Exception) && mixed isa MethodError
      println("REPRODUCED tmpl-parse-accepts")
  end
runtime:
  julia_version: "1.12.6"
  sr_commit: "103f5d4299222fa4af70110f4886ced4f3fdac1b"
  de_version: "2.13.0"
  output: |
    RUNTIME julia=1.12.6 de=2.13.0
    guess (f="#1 + 1.0", g="sin(#1) * 2.0") -> TemplateExpression
    guess (f="#1 + 1.0", g="sin(#1)")       -> MethodError  (expected a TemplateExpression)
    REPRODUCED tmpl-parse-accepts
expected: |-
  Parse otherwise valid component guesses in one scalar type.
promised_by: |-
  One valid expression string per declared component is valid guess input.
cause: |-
  src/TemplateExpression.jl:1406-1424: Ordinary guesses with a float literal in one component and none in another can produce incompatible node types.
possible_fix: "Pass a common scalar type to each parser or promote before constructing the template."
