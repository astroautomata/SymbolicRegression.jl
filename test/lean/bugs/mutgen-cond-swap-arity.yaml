    RUNTIME julia=1.12.6 de=2.13.0
    tree: operator_deg3[1](x1, x2, x3)  swap_operands gives: operator_deg3[1](x3, x2, x1)
    SwapOperandsMutation weight: options 0.198, conditioned 0.0
    REPRODUCED mutgen-cond-swap-arity
expected: |-
